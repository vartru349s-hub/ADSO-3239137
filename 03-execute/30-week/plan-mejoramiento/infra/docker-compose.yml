services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bike_share
      POSTGRES_USER: bike_share
      POSTGRES_PASSWORD: bike_share_local
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bike_share]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bike_share_data:/var/lib/postgresql/data
  api:
    build: ../api
    environment:
      APP_NAME: Bike Share
      APP_ENV: local
      APP_KEY: base64:WmVyb1NlY3JldEZvckRlbW9Pbkx5MTIzNDU2Nzg5MDE=
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: bike_share
      DB_USERNAME: bike_share
      DB_PASSWORD: bike_share_local
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 8000:8000
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"
  app:
    build:
      context: ../app
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
    ports:
      - 5173:80
volumes:
  bike_share_data:
