openapi: 3.1.0
info:
  title: Bike Share API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      responses:
        '200': {description: Servicio disponible}
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}
      responses:
        '200': {description: Token generado}
        '401': {description: Credenciales inválidas}
  /categories:
    get:
      responses:
        '200': {description: Categorías}
  /users:
    get: {responses: {'200': {description: Usuarios paginados}}}
    post: {responses: {'201': {description: Usuario creado}, '422': {description: Validación}}}
  /bicycles:
    get: {responses: {'200': {description: Bicicletas paginadas}}}
    post: {responses: {'201': {description: Bicicleta creada}, '422': {description: Validación}}}
  /bicycles/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {responses: {'200': {description: Bicicleta}, '404': {description: No encontrada}}}
    put: {responses: {'200': {description: Bicicleta actualizada}, '422': {description: Validación}}}
    delete: {responses: {'204': {description: Baja lógica}, '409': {description: Alquiler abierto}}}
  /rentals:
    get: {responses: {'200': {description: Alquileres paginados}}}
    post: {responses: {'201': {description: Alquiler creado}, '409': {description: Regla o disponibilidad}, '422': {description: Validación}}}
  /rentals/overdue:
    get: {responses: {'200': {description: Líneas vencidas}}}
  /rentals/{rental}/lines/{line}/return:
    parameters:
      - {name: rental, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: line, in: path, required: true, schema: {type: string, format: uuid}}
    post: {responses: {'200': {description: Unidad devuelta}, '409': {description: Ya devuelta}}}
  /reports/most-requested:
    get:
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses: {'200': {description: Reporte}, '422': {description: Rango inválido}}
